# nginx in front of the SeedCode container, on a server shared with other
# sites. Goes in /etc/nginx/conf.d/seedcode.conf. Everything here is named
# "seedcode_" or scoped to this one server name, so the other sites are
# untouched. The certificate comes from certbot (see deploy/README.md).

# How often one address may call, before nginx answers 429. The app keeps
# its own limits as well (backend/app/limits.py); these stop floods first.
limit_req_zone $binary_remote_addr zone=seedcode_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=seedcode_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=seedcode_api:10m rate=30r/s;

upstream seedcode_app {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    server_name seed.skyquestinsights.com;
    # Phones open the https address printed in the QR code; anything else
    # is moved there.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name seed.skyquestinsights.com;

    ssl_certificate /etc/letsencrypt/live/seed.skyquestinsights.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seed.skyquestinsights.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Browsers use https for this site from now on, even if told http.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The largest request is an Excel import of 5,000 rows (25 MB in the app).
    client_max_body_size 26m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    limit_req_status 429;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The address nginx saw, replacing anything the caller wrote there: the
    # app trusts only the last address in this header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # Signing in: a person types a password a few times a minute at most.
    location = /api/login {
        limit_req zone=seedcode_login burst=10 nodelay;
        proxy_pass http://seedcode_app;
    }

    # Farmers' phones send entries here; a phone back in signal sends all it
    # saved at once, so the burst is generous.
    location = /api/entries {
        limit_req zone=seedcode_public burst=60 nodelay;
        proxy_pass http://seedcode_app;
    }

    # The export streams a long CSV as it is written: pass it straight on.
    location = /api/entries/export {
        limit_req zone=seedcode_api burst=20 nodelay;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://seedcode_app;
    }

    location /api/ {
        limit_req zone=seedcode_api burst=100 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://seedcode_app;
    }

    # The pages and their files.
    location / {
        proxy_pass http://seedcode_app;
    }
}
