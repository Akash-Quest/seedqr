# Every pull request: test the backend, check and build the frontend, and
# build the image. Every push to main: also publish the image.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the run before it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seedcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL
        run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/seedcode_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Name the image
        id: name
        # Image names must be lower case; the repository's may not be.
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "image=$repository:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests only prove that the image builds.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repository }}:latest
          build-args: |
            VITE_PUBLIC_URL=${{ vars.PUBLIC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
